name: Vault CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Start Ephemeral PostgreSQL 15 Test Container
      run: |
        PG_PW="$(openssl rand -hex 16)"
        docker run -d --name ci-pg-it -p 127.0.0.1:5433:5432 \
          -e POSTGRES_DB=vault \
          -e POSTGRES_USER=vault \
          -e POSTGRES_PASSWORD="$PG_PW" \
          postgres:15-alpine
        for _ in $(seq 1 30); do
          if docker exec ci-pg-it pg_isready -U vault -d vault >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        docker exec ci-pg-it pg_isready -U vault -d vault
        echo "VAULT_IT_POSTGRES_URL=jdbc:postgresql://127.0.0.1:5433/vault" >> "$GITHUB_ENV"
        echo "VAULT_IT_POSTGRES_USER=vault" >> "$GITHUB_ENV"
        echo "VAULT_IT_POSTGRES_PASSWORD=$PG_PW" >> "$GITHUB_ENV"

    - name: Run Unit, MVC, and Mandatory PostgreSQL Integration Suites
      run: |
        mvn -B test -Dvault.postgres-it.required=true --file pom.xml
        for suite in VaultPostgresIntegrationTest PostgresSchemaMigrationIntegrationTest; do
          report="vault-node/target/surefire-reports/TEST-com.vault.node.${suite}.xml"
          test -f "$report" || { echo "Missing report: $report"; exit 1; }
          if grep -qE 'skipped="[1-9]' "$report" || grep -q 'tests="0"' "$report"; then
            echo "ERROR: Mandatory PostgreSQL suite $suite did not execute cleanly:"
            cat "$report"
            exit 1
          fi
        done

    - name: Stop Ephemeral PostgreSQL 15 Test Container
      if: always()
      run: docker rm -f ci-pg-it >/dev/null 2>&1 || true

    - name: Package Application Artifacts
      run: mvn -B package -DskipTests --file pom.xml

    - name: Docker Build and 3-Node Compose Smoke Test
      run: bash scripts/smoke_compose.sh

    - name: Publish Surefire and Compose Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ci-failure-logs
        path: |
          vault-common/target/surefire-reports/**
          vault-node/target/surefire-reports/**
          vault-node/target/smoke-logs/**
        if-no-files-found: ignore
